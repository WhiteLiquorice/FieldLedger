<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#182130" stroke-width="8" />
  
  <!-- Clipboard Body -->
  <rect x="116" y="106" width="280" height="340" rx="36" fill="#111722" stroke="#253247" stroke-width="12" />
  
  <!-- Clipboard Clip Top -->
  <path d="M 186 106 C 186 80, 210 60, 240 60 L 272 60 C 302 60, 326 80, 326 106 Z" fill="#182130" stroke="#374761" stroke-width="8" />
  <circle cx="256" cy="88" r="14" fill="#f97316" />

  <!-- Verification Checkmark with Safety Orange Gradient -->
  <path d="M 176 276 L 236 336 L 346 206" fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Small Laser Scan Line Indicator -->
  <line x1="156" y1="386" x2="356" y2="386" stroke="#f97316" stroke-width="6" stroke-linecap="round" opacity="0.8" />
</svg>
